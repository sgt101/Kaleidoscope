version: '3.8'

services:
  kaleidoscope:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # The assistant goes through the bridge: run `node bridge.js` on this machine, with the same BRIDGE_TOKEN (see .env.example).
      - BRIDGE_URL=${BRIDGE_URL:-http://host.docker.internal:8793}
      - BRIDGE_TOKEN=${BRIDGE_TOKEN:-}
      - TRIFLE_TOKEN=${TRIFLE_TOKEN:-}
      - TRIFLE_URL=${TRIFLE_URL:-http://host.docker.internal:8792}
      - NODE_ENV=production
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-}
      - WORKSPACE_DIR=/workspace
    volumes:
      - ${WORKSPACE_DIR:-./documents}:/workspace
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
